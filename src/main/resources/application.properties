spring.application.name=live-plane-tracker
# Render provides PORT; falls back to 8080 locally
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# In-memory H2 database (flight position history)
spring.datasource.url=jdbc:h2:mem:planes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Keep the H2 console off on a public host. Set H2_CONSOLE=true to use it locally.
spring.h2.console.enabled=${H2_CONSOLE:false}

# ---- Tracker settings (override with environment variables) ----
# simulated = built-in demo flights over India (works offline)
# opensky   = real live data from the OpenSky Network
tracker.provider=${TRACKER_PROVIDER:simulated}
tracker.poll-interval-ms=${TRACKER_POLL_INTERVAL_MS:5000}

# Simulation provider
tracker.simulation.plane-count=${SIMULATION_PLANE_COUNT:25}
tracker.simulation.time-scale=${SIMULATION_TIME_SCALE:20}

# OpenSky provider (use poll interval of 10000 or more for anonymous access)
tracker.opensky.base-url=https://opensky-network.org/api
tracker.opensky.lamin=${OPENSKY_LAMIN:6}
tracker.opensky.lomin=${OPENSKY_LOMIN:68}
tracker.opensky.lamax=${OPENSKY_LAMAX:36}
tracker.opensky.lomax=${OPENSKY_LOMAX:98}
tracker.opensky.username=${OPENSKY_USERNAME:}
tracker.opensky.password=${OPENSKY_PASSWORD:}

# History
tracker.history.retention-minutes=60
tracker.history.max-flights-per-poll=300
